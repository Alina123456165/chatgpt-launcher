
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ChatGPT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChatGPT">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
}

#splash {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
}

.logo {
    width: 72px;
    height: 72px;
}

.text {
    color: #000;
    margin-top: 22px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.sub {
    color: #777;
    margin-top: 10px;
    font-size: 14px;
}

.fadeout {
    opacity: 0;
    transition: opacity 0.45s ease;
}
</style>
</head>
<body>

<div id="splash">
    <svg class="logo" viewBox="0 0 24 24" fill="none"
         xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.5a5.5 5.5 0 0 0-5.25 3.85
        5.5 5.5 0 0 0-3.1 8.8 5.5 5.5 0 0 0
        5.1 6.35 5.5 5.5 0 0 0 6.5-.05
        5.5 5.5 0 0 0 5.1-6.3 5.5 5.5 0 0
        0-3.1-8.8A5.5 5.5 0 0 0 12 2.5Z"
        stroke="#000" stroke-width="1.5"
        stroke-linejoin="round"/>
        <path d="m8.1 6.1 7.8 4.5M4.5 9.1l7.6
        4.4m-7.2 4.2 7.2-4.2m.1 7.1v-8.1
        m7.2-3.4-7.2 4.2m3.9-7.2-3.9 7.2"
        stroke="#000" stroke-width="1.5"
        stroke-linecap="round"/>
    </svg>
    <div class="text">ChatGPT</div>
    <div class="sub">Launching...</div>
</div>

<script>
(function () {
    const url = "https://chatgpt.com/";
    const splash = document.getElementById("splash");

    setTimeout(function () {
        splash.classList.add("fadeout");

        setTimeout(function () {
            window.location.replace(url);
        }, 450);
    }, 900);
})();
</script>

</body>
</html>
