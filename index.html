<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ChatGPT App</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="color-scheme" content="dark">

  <style>
    :root {
      color-scheme: dark;
      background: #000;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000 !important;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000 !important;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.6);
    }

    h1 {
      margin: 0;

    }

    p {
      opacity: .6;
      margin: 10px 0 30px;

    button {
      border: none;

</head>

      Open App
    </button>

    <div class="footer">

    </div>
  </div>

  <script>
    function openGPT() {
