<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ChatGPT App</title>

  <!-- iOS app-like behavior -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      overflow: hidden;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    p {
      opacity: 0.6;
      margin-top: 10px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    button {
      border: none;
      background: white;
      color: black;
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .footer {
      position: absolute;
      bottom: 18px;
      font-size: 12px;
      opacity: 0.35;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🤖</div>

    <h1>ChatGPT</h1>

    <p>Open ChatGPT in app mode</p>

    <button onclick="openGPT()">
      Open App
    </button>

    <div class="footer">
      Add to Home Screen for full app feel
    </div>

  </div>

  <script>
    function openGPT() {
      window.location.href = "https://chatgpt.com";
    }
  </script>

</body>
</html>
