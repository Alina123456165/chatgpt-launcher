
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ChatGPT App</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">

  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff !important;
      color: #000000 !important;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
h
    h1 {
      margin: 0;
      font-size: 26px;
      color: #000000;
    }

    p {
      margin: 10px 0 30px;
      color: #666666;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 16px 26px;
      border: none;
      border-radius: 14px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.97);
    }

    .footer {
      margin-top: 24px;
      color: #777777;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="logo">🤖</div>

    <h1>ChatGPT</h1>

    <p>Open ChatGPT in app mode</p>

    <a class="button" href="https://chatgpt.com/">
      Open App
    </a>

    <div class="footer">
      Add to Home Screen for an app-like experience
    </div>

  </main>
</body>
</html>
