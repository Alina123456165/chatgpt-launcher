
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ChatGPT</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">

  <style>
    :root {
      color-scheme: light;
      background: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff !important;
      color: #000000 !important;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 24px;
      max-width: 420px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #000000;
    }

    p {
      margin: 10px 0 24px;
      color: #666666;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 15px 22px;
      border-radius: 14px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    .button:active {
      opacity: 0.8;
    }

    .footer {
      margin-top: 24px;
      color: #777777;
      font-size: 12px;
    }
  </style>

  <script>
    window.location.replace("https://chatgpt.com/");
  </script>
</head>

<body>
  <main class="container">
    <div class="logo">🤖</div>

    <h1>ChatGPT</h1>

    <p>
      Opening ChatGPT...
      If it doesn't open automatically, tap below.
    </p>

    <a class="button" href="https://chatgpt.com/">
      Open ChatGPT
    </a>

    <div class="footer">
      Your login is managed securely by ChatGPT.
    </div>
  </main>
</body>
</html>
