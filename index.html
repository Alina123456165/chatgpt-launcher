
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ChatGPT</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChatGPT">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff !important;
      color: #000000 !important;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 16px 30px;
      border-radius: 14px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      opacity: 0.75;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">🤖</div>

    <h1>ChatGPT</h1>

    <a class="button" href="https://chatgpt.com/">
      Open App
    </a>
  </main>
</body>
</html>
